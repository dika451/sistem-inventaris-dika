<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Informasi Inventaris Pro</title>
    <link rel="stylesheet" href="style.css">
    <!-- Menggunakan Font Awesome untuk Ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="logo">
            <i class="fa-solid fa-boxes-stacked"></i> <span>InvenPro</span>
        </div>
        <ul class="menu">
    <li class="active" onclick="gantiHalaman('dashboard', this)"><i class="fa-solid fa-gauge"></i> Dashboard</li>
    <li onclick="gantiHalaman('barang', this)"><i class="fa-solid fa-box"></i> Barang</li>
    <li onclick="gantiHalaman('laporan', this)"><i class="fa-solid fa-chart-line"></i> Laporan</li>
    <li onclick="gantiHalaman('pengaturan', this)"><i class="fa-solid fa-gear"></i> Pengaturan</li>
</ul>
    </div>

    <!-- Konten Utama -->
    <div class="main-content">
        <header>
            <div>
                <h1>Dashboard Inventaris</h1>
                <p>Selamat datang kembali, Dika. Berikut ringkasan data Anda hari ini.</p>
            </div>
            <div class="user-profile">
                <img src="https://ui-avatars.com/api/?name=Dika&background=0D8ABC&color=fff" alt="User">
            </div>
        </header>

        <!-- Kartu Statistik -->
        <!-- Bungkus semua konten utama dengan ID ini -->
<div id="halaman-dashboard">
    <!-- (Biarkan kode stats-grid, grid-layout, dan isinya tetap sama seperti sebelumnya, cukup dibungkus saja) -->
    <div class="stats-grid">...</div>
    <div class="grid-layout">...</div>
</div>

<!-- Tambahkan placeholder untuk halaman lain -->
<div id="halaman-lain" style="display: none; padding: 40px; text-align: center;">
    <h2 id="judul-halaman-lain">Halaman</h2>
    <p>Fitur ini sedang dalam tahap pengembangan (Coming Soon).</p>
</div>

    <script src="script.js"></script>
</body>
</html>
